<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: without it iOS Safari never reports real
         env(safe-area-inset-*) values (they stay 0), which silently breaks
         every safe-area padding rule already in this codebase
         (filters.css, panel.css, categories.css) on notched devices. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Acompanhe suas sincronizações no Julius." />
    <title>Julius</title>
    <!-- Brand mark only (header title "Julius" + its subtitle) — the
         app's body copy stays on the system font stack in global.css,
         this isn't a full typography change. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
