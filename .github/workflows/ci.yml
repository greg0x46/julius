name: CI

# `stage` is the integration branch: its pushes and PRs run the same checks as
# `main`, but only a push to `main` can publish a release (see the release job).
on:
  push:
    branches: [main, stage]
  pull_request:
    branches: [main, stage]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only superseded PR runs are cancelled: every push to main/stage must keep its
  # own result, because that result is the evidence for that exact commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-24.04
    # The Postgres tests skip themselves without JULIUS_TEST_POSTGRES_DSN;
    # the service makes them run alongside the SQLite ones.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: julius_test
          POSTGRES_PASSWORD: synthetic-test-password
          POSTGRES_DB: julius_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U julius_test -d julius_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JULIUS_TEST_POSTGRES_DSN: postgres://julius_test:synthetic-test-password@127.0.0.1:5432/julius_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install independent MCP test clients
        run: |
          python3 -m venv "$RUNNER_TEMP/mcp-client"
          "$RUNNER_TEMP/mcp-client/bin/pip" install -r internal/mcp/testdata/requirements.txt
          echo "JULIUS_MCP_TEST_PYTHON=$RUNNER_TEMP/mcp-client/bin/python" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/mcp-inspector" --ignore-scripts --no-audit --no-fund @modelcontextprotocol/inspector@2.13.0
          echo "JULIUS_MCP_TEST_INSPECTOR=$RUNNER_TEMP/mcp-inspector/node_modules/.bin/mcp-inspector" >> "$GITHUB_ENV"
      - run: go build ./...
      - run: go vet ./...
      # -p 1: the Postgres tests reset the shared database's public schema, so
      # packages must not run them concurrently. -count=1: results depend on the
      # database, so a restored test cache must not stand in for a real run.
      - run: go test -p 1 -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # Release scripts (version, changelog, notes) against throwaway Git histories.
      - name: Release script tests
        run: scripts/tests/run.sh

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test -- --run
      # build runs tsc -b (strict app/test and Vite config checks) before Vite.
      - run: npm run build
        env:
          VITE_APP_VERSION: ${{ github.ref == 'refs/heads/stage' && 'stage' || 'dev' }}
          VITE_APP_COMMIT: ${{ github.sha }}
      # Catches embed breakage on PRs instead of only in the release build.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build with the embedded frontend
        run: |
          cp -r dist ../internal/webui/dist
          cd .. && go build -tags embedded_frontend -o /dev/null ./cmd/julius

      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Financial browser journeys
        shell: bash
        run: npm run test:e2e 2>&1 | tee e2e.log
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-failure-evidence
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/e2e.log
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: Release (linux/amd64)
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Queued, never cancelled: each run checks out after the previous one has
    # published its tag, so scripts/next-version.sh always sees it.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Select version
        id: version
        run: |
          tag=$(scripts/next-version.sh)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ -z "$tag" ]; then
            echo "No feat/fix/perf or breaking change since the last tag; skipping release."
          fi

      # The notes are the committed CHANGELOG.md section of the version just
      # computed; they are not regenerated here. Fails (before anything is built
      # or published) when the changelog has no section for that version or its
      # newest section is a different version.
      - name: Release notes from CHANGELOG.md
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          latest=$(scripts/changelog-section.sh --latest)
          if [ "$latest" != "$TAG" ]; then
            echo "::error::next-version.sh computes $TAG but the newest CHANGELOG.md section is $latest"
            exit 1
          fi
          scripts/changelog-section.sh "$TAG" > notes-body.md
          { cat notes-body.md; printf '\n%s\n' "$GITHUB_SHA"; } > notes.md

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: steps.version.outputs.tag != ''
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.version.outputs.tag != ''
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        if: steps.version.outputs.tag != ''
        env:
          VITE_APP_VERSION: ${{ steps.version.outputs.tag }}
          VITE_APP_COMMIT: ${{ github.sha }}
        run: |
          ./build.sh
          mv julius julius-linux-amd64
          sha256sum julius-linux-amd64 > SHA256SUMS

      - name: Attest provenance
        id: attest
        if: steps.version.outputs.tag != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: julius-linux-amd64

      - name: Publish release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cp "$BUNDLE_PATH" julius-linux-amd64.sigstore.json
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file notes.md \
            --latest \
            julius-linux-amd64 \
            julius-linux-amd64.sigstore.json \
            SHA256SUMS
